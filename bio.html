<div class="bio-layout"><figure><img class="portrait" src="assets/portrait.webp" width="900" height="900" alt="Wutao Liu wearing a cap and carrying a camera"></figure><div class="bio-copy"><h2>Wutao Liu<span>刘武韬</span></h2><div class="bio-text" lang="zh-CN"><p>一个有点古怪的人，心里始终住着一个新手。向往未知，期待新鲜的经历，也好奇生活还有多少种可能。</p><p>他喜欢蜿蜒于山间的河流，也喜欢阴影之间的光。拍下那些让他驻足的事物：擦肩而过的陌生人，安静的街角，或许再也不会重返的地方。</p><p>还在学着观看，也还在好奇，别处会有什么。</p></div><p><a href="https://www.instagram.com/alexaander_liu/" target="_blank" rel="noopener noreferrer" aria-label="Instagram: alexaander_liu">Instagram · @alexaander_liu ↗</a></p></div></div>
